# Build and deploy the site on GitHub Pages.
# Adapted from the official "Jekyll" template (actions/starter-workflows/pages/jekyll.yml),
# recommended by https://jekyllrb.com/docs/continuous-integration/github-actions/
#
# To be done once on GitHub : Settings > Pages > Build and deployment >
# Source = "GitHub Actions". Without it, the restricted Jekyll of GitHub Pages
# still builds the site and the plugins (jekyll-polyglot) are ignored.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time ; a running deployment is never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # runs `bundle install` and caches the gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
